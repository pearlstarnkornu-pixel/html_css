<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="3-photo_gallery.css">
</head>
<body>
  <header class="page-header">
    <h1>Wanderlust Gallery</h1>
    <p>A responsive photo grid that reflows automatically as the viewport changes.</p>
  </header>

  <main>
    <section class="gallery">
      <figure class="gallery-item gallery-item-featured">
        <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=900&h=700&fit=crop&q=80" alt="Snow-capped mountain peaks rising above a sea of clouds at sunset">
        <figcaption>Peaks Above the Clouds</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500&h=500&fit=crop&q=80" alt="Sunlit forest path winding between tall pine trees">
        <figcaption>Sunlit Forest Trail</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=500&h=500&fit=crop&q=80" alt="Misty green highland valley with a winding river at sunrise">
        <figcaption>Misty Highland Valley</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?w=500&h=500&fit=crop&q=80" alt="Wooden footbridge crossing through a dense green forest">
        <figcaption>Forest Footbridge</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://images.unsplash.com/photo-1418065460487-3e41a6c84dc5?w=500&h=500&fit=crop&q=80" alt="Dense pine forest shrouded in low fog">
        <figcaption>Foggy Pine Forest</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=500&h=500&fit=crop&q=80" alt="Bow of a wooden rowboat facing a calm mountain lake">
        <figcaption>Rowboat on an Alpine Lake</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://images.unsplash.com/photo-1501594907352-04cda38ebc29?w=500&h=500&fit=crop&q=80" alt="Golden Gate Bridge spanning the bay under a clear sky">
        <figcaption>Golden Gate Bridge</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://images.unsplash.com/photo-1439066615861-d1af74d74000?w=500&h=500&fit=crop&q=80" alt="Wooden dock extending into a calm lake surrounded by forest">
        <figcaption>Quiet Lakeside Dock</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://images.unsplash.com/photo-1470770903676-69b98201ea1c?w=500&h=500&fit=crop&q=80" alt="Wooden boats docked beside lakeside cabins in the mountains">
        <figcaption>Boats at the Mountain Harbor</figcaption>
      </figure>
    </section>
  </main>

  <footer class="page-footer">
    <p>Exercise 3 &mdash; Photo Gallery</p>
  </footer>
</body>
</html>
