<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Item Placement</title>
  <link rel="stylesheet" href="1-placement.css">
</head>
<body>
  <header class="page-header">
    <h1>Line-Based Item Placement</h1>
    <p>Items are placed on specific grid lines and some span multiple tracks.</p>
  </header>

  <main>
    <section class="placement-grid">
      <div class="tile tile-banner">Banner &mdash; spans all 4 columns</div>
      <div class="tile tile-feature">Feature &mdash; spans 2 columns &amp; 2 rows</div>
      <div class="tile tile-a">A</div>
      <div class="tile tile-b">B</div>
      <div class="tile tile-c">C</div>
      <div class="tile tile-d">D</div>
      <div class="tile tile-e">E &mdash; spans all 4 columns</div>
    </section>
  </main>

  <footer class="page-footer">
    <p>Exercise 1 &mdash; Placement</p>
  </footer>
</body>
</html>
