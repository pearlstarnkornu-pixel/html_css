<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
</head>
<body>
    <header>
        <h1>Contact Us</h1>
        <p>Have a question, a bug report, or feedback about the course materials? Fill out the form below and someone from the team will get back to you.</p>
    </header>

    <main>
        <form action="#" method="post">
            <div>
                <label for="contact-name">Full Name</label><br>
                <input type="text" id="contact-name" name="contact-name" placeholder="Jane Doe" required>
            </div>

            <div>
                <label for="contact-email">Email Address</label><br>
                <input type="email" id="contact-email" name="contact-email" placeholder="jane.doe@example.com" required>
            </div>

            <div>
                <label for="contact-message">Message</label><br>
                <textarea id="contact-message" name="contact-message" rows="6" cols="40" placeholder="Type your message here..." required></textarea>
            </div>

            <div>
                <button type="submit">Send Message</button>
            </div>
        </form>
    </main>

    <footer>
        <p>We usually reply within two business days.</p>
    </footer>
</body>
</html>
